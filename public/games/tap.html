<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tap Frenzy</title>
<style>
  html,body{margin:0;min-height:100%;background:#191537;font-family:system-ui,sans-serif;color:#fff}
  .wrap{min-height:100vh;display:grid;place-items:center;padding:14px;box-sizing:border-box}
  .hud{display:flex;justify-content:space-between;width:min(92vw,440px);margin-bottom:12px;font-weight:800;font-size:1.05rem}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(92vw,440px)}
  .hole{aspect-ratio:1;border:none;border-radius:18px;background:#2c2560;font-size:clamp(2rem,9vw,3rem);
        cursor:pointer;display:grid;place-items:center;transition:transform .08s ease}
  .hole:active{transform:scale(.94)}
  .hole.up{background:var(--accent)}
  .overlay{position:fixed;inset:0;background:rgba(20,14,50,.8);display:grid;place-items:center;text-align:center;padding:20px}
  .overlay h1{font-size:1.6rem;margin:0 0 6px}
  .overlay p{margin:0 0 16px;color:#cfc9ee}
  .btn{border:none;border-radius:999px;padding:12px 34px;font-weight:800;font-size:1.05rem;background:#FFB938;color:#241E4E;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="hud"><span>Score: <span id="score">0</span></span><span>⏱ <span id="time">30</span>s</span></div>
    <div class="board" id="board"></div>
  </div>
</div>
<div class="overlay" id="overlay">
  <div>
    <h1 id="ovTitle">Tap Frenzy</h1>
    <p id="ovText">Tap the target as fast as you can. 30 seconds on the clock — it gets faster as you score.</p>
    <button class="btn" id="start">Start</button>
  </div>
</div>
<script>
(function(){
  var P = new URLSearchParams(location.search);
  var TARGET = P.get('e') || '🍪';
  var ACCENT = P.get('c') || '#6C3BFF';
  document.documentElement.style.setProperty('--accent', ACCENT);

  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var startBtn = document.getElementById('start');

  var holes = [];
  for (var i=0;i<9;i++){
    (function(){
      var b = document.createElement('button');
      b.className = 'hole';
      b.setAttribute('aria-label','hole');
      b.addEventListener('pointerdown', function(){
        if (b.classList.contains('up')){
          score++;
          scoreEl.textContent = String(score);
          hide(b);
        }
      });
      board.appendChild(b);
      holes.push(b);
    })();
  }

  var score = 0, timeLeft = 30, popTimer = null, clockTimer = null, current = -1, playing = false;

  function hide(b){
    b.classList.remove('up');
    b.textContent = '';
  }

  function popNext(){
    if (!playing) return;
    if (current >= 0) hide(holes[current]);
    var next;
    do { next = Math.floor(Math.random()*9); } while (next === current);
    current = next;
    holes[current].classList.add('up');
    holes[current].textContent = TARGET;
    var delay = Math.max(380, 780 - score*14);
    popTimer = setTimeout(popNext, delay);
  }

  function start(){
    score = 0; timeLeft = 30; playing = true; current = -1;
    scoreEl.textContent = '0';
    timeEl.textContent = '30';
    holes.forEach(hide);
    overlay.style.display = 'none';
    popNext();
    clockTimer = setInterval(function(){
      timeLeft--;
      timeEl.textContent = String(timeLeft);
      if (timeLeft <= 0) end();
    }, 1000);
  }

  function end(){
    playing = false;
    clearTimeout(popTimer);
    clearInterval(clockTimer);
    holes.forEach(hide);
    ovTitle.textContent = 'Time! You scored ' + score;
    ovText.textContent = score >= 25 ? 'Lightning hands. Go again?' : 'Beat it next round — it speeds up as you score.';
    startBtn.textContent = 'Play again';
    overlay.style.display = 'grid';
  }

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
